name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sil-app/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        working-directory: sil-app
        run: npm install

      - name: Gerar projeto Android e aplicar código nativo
        working-directory: sil-app
        run: |
          npx cap add android
          cp android-overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android-overrides/java/com/sistemrh/sil/*.java android/app/src/main/java/com/sistemrh/sil/
          npx cap sync android

      - name: Compilar APK
        working-directory: sil-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: sil-apk
          path: sil-app/android/app/build/outputs/apk/debug/app-debug.apk
