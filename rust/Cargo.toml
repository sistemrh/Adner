[workspace]
resolver = "2"
members = [
    "crates/adner-core",
    "crates/adner-engine",
    "crates/adner-agents",
    "crates/adner-tools",
    "crates/adner-learning",
    "crates/adner-telemetry",
    "crates/adner-traces",
    "crates/adner-security",
    "crates/adner-mcp",
    "crates/adner-python",
    "crates/adner-sessions",
    "crates/adner-workflow",
    "crates/adner-skills",
    "crates/adner-recipes",
    "crates/adner-templates",
    "crates/adner-a2a",
    "crates/adner-scheduler",
]

# uuid 1.27 requires Rust 1.89; keep this aligned with rust-toolchain.toml.
[workspace.package]
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls"] }
rusqlite = { version = "0.41", features = ["bundled", "column_decltype"] }
regex = "1"
once_cell = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
parking_lot = "0.12"
async-trait = "0.1"
pyo3 = { version = "0.29", features = ["extension-module"] }
meval = "0.2"
time = { version = "0.3.55", default-features = false, features = ["std", "large-dates"] }
futures = "0.3"
tokio-stream = "0.1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
fnmatch-regex = "0.2"
url = "2"
rig-core = "0.31"
schemars = "1"
