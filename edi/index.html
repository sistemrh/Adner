<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sil</title>
<link rel="stylesheet" href="style.css?v=24" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%2300e5ff' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='15' fill='%2300e5ff'/%3E%3C/svg%3E" />
</head>
<body>
<div class="hud">
  <header>
    <h1>SIL</h1>
  </header>

  <div class="orb-stage">
    <div class="orb-ring ring-1"></div>
    <div class="orb-ring ring-2"></div>
    <div class="orb-ring ring-3"></div>
    <button id="orb" class="orb" aria-label="Falar com a Sil" title="Clique para falar">
      <span class="orb-core"></span>
    </button>
  </div>

  <p id="status" class="status">Toque no núcleo para ativar</p>

  <div class="controls">
    <label class="toggle">
      <input type="checkbox" id="continuous" />
      <span>Escuta contínua (diga "Sil")</span>
    </label>
    <button id="stop-speech" class="ghost-btn" title="Interromper fala">⏹ Silenciar</button>
  </div>

  <form id="text-form" class="text-form">
    <input id="text-input" type="text" placeholder="Digite sua mensagem…" autocomplete="off" />
    <button type="submit">Enviar</button>
  </form>

  <section id="log" class="log" aria-live="polite"></section>
</div>

<script src="app.js?v=24"></script>
</body>
</html>
